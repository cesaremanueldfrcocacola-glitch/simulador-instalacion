<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFR AUTO - Simulador 3D Avanzado</title>
<style>
body{margin:0;overflow:hidden;background:#050b12;color:#fff;font-family:Segoe UI,Arial}
#panel{
position:absolute;left:10px;top:10px;z-index:10;
background:rgba(0,0,0,.75);padding:12px;border-radius:10px;width:260px
}
button{width:100%;margin:4px 0;padding:8px;border:none;border-radius:6px}
h2{margin:0 0 8px 0}
.status{font-size:13px;line-height:1.6}
</style>
</head>
<body>

<div id="panel">
<h2>DFR AUTO</h2>
<button onclick="toggleMode()">Modo Ingeniería / Futurista</button>
<button onclick="toggleBody()">Mostrar/Ocultar Carrocería</button>
<button onclick="toggleRelay()">Relay ON/OFF</button>
<div class="status" id="status">
ESP32: ONLINE<br>
SIM800L: ONLINE<br>
Firebase: ONLINE<br>
Relay: OFF<br>
Bomba: OFF
</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050b12);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
camera.position.set(10,6,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0xffffff,2));

const light=new THREE.PointLight(0x66ffcc,8,100);
light.position.set(0,10,0);
scene.add(light);

// Vehículo
const bodyMat=new THREE.MeshPhysicalMaterial({
color:0x666666,transparent:true,opacity:.35
});

const body=new THREE.Mesh(
new THREE.BoxGeometry(8,2,4),
bodyMat
);
scene.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(4,1.5,3.2),
bodyMat
);
cabin.position.y=1.5;
scene.add(cabin);

// Componentes
function box(w,h,d,c,x,y,z,name){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:c})
 );
 m.position.set(x,y,z);
 m.userData.name=name;
 scene.add(m);
 return m;
}

const battery=box(.8,.5,.8,0xff0000,-3.2,.8,0,"Batería");
const fuse=box(.7,.5,.7,0xffff00,-2,.8,0,"Fusiblera");
const relay=box(.7,.5,.7,0x00ff00,-1,.8,0,"Relay");
const esp32=box(1.2,.2,.7,0x3366ff,0.5,1,0,"ESP32");
const sim800=box(1,.2,.6,0xaa55ff,1.9,1,0,"SIM800L");
const buck=box(.8,.2,.5,0xcc8800,3,1,0,"Buck");
const cap=box(.3,.6,.3,0xcccc66,3.8,1,0,"Capacitor");
const pump=box(.8,.4,.8,0x00ffff,3.2,.8,0,"Bomba");

const cableMat=new THREE.LineBasicMaterial({color:0x00ff00});
function cable(a,b){
 const pts=[a.position,b.position];
 const g=new THREE.BufferGeometry().setFromPoints(pts);
 const l=new THREE.Line(g,cableMat);
 scene.add(l);
 return l;
}

cable(battery,fuse);
cable(fuse,relay);
cable(relay,pump);
cable(fuse,buck);
cable(buck,esp32);
cable(esp32,sim800);

let futuristic=false;
let relayOn=false;

window.toggleMode=()=>{
 futuristic=!futuristic;

 if(futuristic){
   scene.background=new THREE.Color(0x001a14);
   light.color.set(0x00ff99);
 }else{
   scene.background=new THREE.Color(0x050b12);
   light.color.set(0x66ffcc);
 }
};

window.toggleBody=()=>{
 body.visible=!body.visible;
 cabin.visible=!cabin.visible;
};

window.toggleRelay=()=>{
 relayOn=!relayOn;

 relay.material.color.set(relayOn?0xff0000:0x00ff00);
 pump.material.color.set(relayOn?0x00ff00:0x00ffff);

 document.getElementById("status").innerHTML=
 `ESP32: ONLINE<br>
 SIM800L: ONLINE<br>
 Firebase: ONLINE<br>
 Relay: ${relayOn?'ON':'OFF'}<br>
 Bomba: ${relayOn?'ON':'OFF'}`;
};

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

window.addEventListener('click',e=>{
 mouse.x=(e.clientX/innerWidth)*2-1;
 mouse.y=-(e.clientY/innerHeight)*2+1;

 raycaster.setFromCamera(mouse,camera);
 const hits=raycaster.intersectObjects(scene.children);

 if(hits.length){
   const n=hits[0].object.userData.name;
   if(n) alert(n);
 }
});

function animate(){
 requestAnimationFrame(animate);
 controls.update();

 if(futuristic){
   esp32.rotation.y+=0.01;
   sim800.rotation.y+=0.01;
 }

 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
